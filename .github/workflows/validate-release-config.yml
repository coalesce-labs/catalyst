name: Validate Release Config

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate release-please config
        run: bash scripts/validate-release-config.sh

      - name: Test validate-release-config.sh (CTL-1463)
        run: bash scripts/__tests__/validate-release-config.test.sh
