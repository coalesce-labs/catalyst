name: packaging-gate

# Guards the CTL-1463 vendor-neutral packaging pipeline (scripts/packaging/):
# the RenderedPack contract, the CTL-1461 adapter seam, the pack.json
# manifests, the safety gate, the loss classifier, and the
# claude/codex/agents-skills emitters — most load-bearingly, the byte-exact
# Claude round-trip that proves regeneration reproduces the committed tree,
# and (CTL-1461 Phase 3) the drift gate that extends that same guarantee
# across ALL THREE targets by literally regenerating and diffing.
#
# Same shape as skills-gate.yml and for the same reason: every PR, no
# `paths:` filter. execution-core-tests.yml's detect-changes step is an
# explicit allow-list that does not include scripts/packaging/**, so scoping
# this gate behind that job would report `skipped` on exactly the PRs it
# exists to check.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  packaging-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Run packaging test suite
        run: bun test scripts/packaging/__tests__/
      - name: Test the drift gate itself (scratch copy, not this checkout)
        run: bash scripts/packaging/__tests__/drift-gate.test.sh
      - name: Rehearse a plugin-deletion cut (scratch copy, not this checkout)
        run: bash scripts/packaging/__tests__/inventory-cut.test.sh
      - name: Regenerate all three targets
        run: bun scripts/packaging/cli.mjs render --write --allow-losses
      - name: Drift gate — tracked-file diff
        run: |
          FIX="Run 'bun scripts/packaging/cli.mjs render --write \
          --allow-losses' locally, review the diff, and commit it."
          if ! git diff --exit-code; then
            echo "::error::Generated output drifted from committed source. $FIX"
            exit 1
          fi
      - name: Drift gate — untracked-file check (diff alone misses new files)
        run: |
          FIX="Run 'bun scripts/packaging/cli.mjs render --write \
          --allow-losses' locally, review the diff, and commit it."
          st="$(git status --porcelain)"
          if [[ -n "$st" ]]; then
            echo "$st"
            echo "::error::Regeneration produced untracked output. $FIX"
            exit 1
          fi
