name: packaging-gate

# Guards the CTL-1463 vendor-neutral packaging pipeline (scripts/packaging/):
# the RenderedPack contract, the CTL-1461 adapter seam, the pack.json
# manifests, the safety gate, the loss classifier, and the
# claude/codex/agents-skills emitters — most load-bearingly, the byte-exact
# Claude round-trip that proves regeneration reproduces the committed tree,
# and (CTL-1461 Phase 3) the drift gate that extends that same guarantee
# across ALL THREE targets by literally regenerating and diffing.
#
# CTL-2215 Phase 2 adds a SEPARATE guard after regeneration: agentskills.io
# conformance grades the freshly-regenerated agentsSkills pack against the
# external `skills` CLI's own contract (frontmatter shape, no name
# collisions, no leaked `metadata.internal`). Drift and conformance are
# deliberately different failures with different causes — drift means "this
# tree disagrees with what's committed"; conformance means "this tree,
# whatever it is, would not install cleanly via `npx skills add`" — so a
# green drift gate says nothing about whether the emitted pack is
# spec-conformant, and this step exists to close that gap.
#
# CTL-2215 Phase 5 adds a THIRD guard, immediately after conformance: the
# install-verification harness (skills-cli-install.test.sh) drives the REAL
# `skills` CLI against a scratch copy of the freshly-regenerated tree —
# conformance grades the tree's shape against the CLI's own parser contract,
# but only an actual install proves the CLI discovers and installs it
# cleanly, and only a deliberately malformed fixture proves the CLI itself
# (not just our grader) rejects a bad skill. The harness refuses to run a
# project-scope install with cwd inside this checkout — that would write
# into .agents/skills/, this emitter's own output directory, and produce a
# drift failure attributed to the wrong cause — so every install in it runs
# against a scratch source tree and a scratch project directory, never this
# checkout, and it asserts `git status --porcelain` is unchanged before/after
# as proof it left the worktree alone.
#
# Same shape as skills-gate.yml and for the same reason: every PR, no
# `paths:` filter. execution-core-tests.yml's detect-changes step is an
# explicit allow-list that does not include scripts/packaging/**, so scoping
# this gate behind that job would report `skipped` on exactly the PRs it
# exists to check.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  packaging-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Run packaging test suite
        run: bun test scripts/packaging/__tests__/
      - name: Test the drift gate itself (scratch copy, not this checkout)
        run: bash scripts/packaging/__tests__/drift-gate.test.sh
      - name: Rehearse a plugin-deletion cut (scratch copy, not this checkout)
        run: bash scripts/packaging/__tests__/inventory-cut.test.sh
      - name: Regenerate all three targets
        run: bun scripts/packaging/cli.mjs render --write --allow-losses
      - name: agentskills.io conformance (spec-check the regenerated portable pack)
        run: bun scripts/packaging/cli.mjs conformance --target agentsSkills
      - name: Install-verification (real `skills` CLI, scratch copy, not this checkout)
        run: bash scripts/packaging/__tests__/skills-cli-install.test.sh
      - name: Drift gate — tracked-file diff
        run: |
          FIX="Run 'bun scripts/packaging/cli.mjs render --write \
          --allow-losses' locally, review the diff, and commit it."
          if ! git diff --exit-code; then
            echo "::error::Generated output drifted from committed source. $FIX"
            exit 1
          fi
      - name: Drift gate — untracked-file check (diff alone misses new files)
        run: |
          FIX="Run 'bun scripts/packaging/cli.mjs render --write \
          --allow-losses' locally, review the diff, and commit it."
          st="$(git status --porcelain)"
          if [[ -n "$st" ]]; then
            echo "$st"
            echo "::error::Regeneration produced untracked output. $FIX"
            exit 1
          fi
