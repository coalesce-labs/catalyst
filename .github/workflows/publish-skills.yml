name: publish-skills

# CTL-2215 Phase 3 — publishes the portable agentsSkills pack
# (`.agents/skills/`) to the generated-artifact repo
# `coalesce-labs/catalyst-skills`, under `skills/` (D1 — the CLI's own
# convention, and not subject to the `.agents/skills/`-scoped
# `isInstalledProjectSkill` lock filter — see the plan's Key Discoveries).
#
# D2 — history: an ordinary accumulating commit on `main`, NEVER a
# force-push and NEVER an orphan rewrite. A rewritten history would make a
# previously-recorded pack SHA unreachable, breaking CTC-977's image-label
# pinning.
#
# D3 — idempotency, loudly: a byte-identical regeneration reports
# `no-change` in the job summary and pushes nothing. `published` and
# `no-change` are distinguishable outcomes, never the same success path
# wearing two names.
#
# D4 — refuses to publish an ungraded tree: agentskills.io conformance runs
# BEFORE the push and aborts the job on `violations` or `inconclusive`.
#
# D5 — a missing SKILLS_PUBLISH_TOKEN or an unresolvable target repo FAILS
# the job with a named error pointing at CTL-2215 Phase 4 (the
# coordinator-gated repo-creation + token-provisioning step). It never
# skips — a publish step that silently no-ops on a missing credential is how
# a fleet ships a stale pack for a month.
#
# The decision of WHETHER/WHAT to publish is a pure, unit-tested function
# (scripts/packaging/publish/plan-publish.mjs, exercised by
# run-publish.mjs) — git mechanics (clone/commit/push/tag) stay bash steps
# here, and SKILLS_PUBLISH_TOKEN is scoped to only the two steps that need
# it (clone, push) — never threaded through the JS driver's environment.
#
# Until CTL-2215 Phase 4 runs, the "Require SKILLS_PUBLISH_TOKEN" step below
# is EXPECTED to fail loudly — that is the correct pre-Phase-4 state, not a
# bug in this workflow.
#
# CTL-2263 3a/3b — turning on the release trigger (release-please.yml, once
# reinstated) exposed two latent defects that had never fired because
# nothing created a release event since CTL-2220: with
# separate-pull-requests: false, one release-PR merge can publish up to 5
# releases at once.
#   3a: no concurrency group meant up to 5 jobs could clone this pack repo
#       and race `git push origin HEAD:main` simultaneously. The group below
#       is keyed to the WORKFLOW, not the ref — the point is that DIFFERENT
#       release runs must never run together — with cancel-in-progress:
#       false, since every queued release still needs its own tag pushed; a
#       cancelled run is a lost tag, not a skipped duplicate.
#
#       ⚠️ KNOWN LIMITATION, and it is the opposite of what the sentence
#       above wants. `cancel-in-progress: false` protects the RUNNING job
#       only. GitHub's concurrency queue holds exactly ONE pending run per
#       group: "any previously pending job or workflow in the concurrency
#       group will be canceled." So with N releases from one merge, run 1
#       executes, runs 2..N-1 are each superseded while pending, and only
#       run N survives to execute — the middle releases DO lose their
#       mirrored tag, which is precisely the loss this group was added to
#       prevent. Serializing is still right (parallel runs corrupt the
#       branch push); the queue depth is the part GitHub does not give us.
#       RECOVERY, and it is exact rather than approximate: re-run each
#       cancelled run from the Actions tab. The tag step below is idempotent
#       and fail-closed, so a re-run pushes only the missing tag and a tag
#       already at the right SHA is a no-op. A durable fix (per-release
#       concurrency group plus a rebase-and-retry on the branch push, so no
#       run is ever superseded) is deliberately NOT attempted here — it is
#       new, untestable-in-CI workflow logic and belongs in its own ticket.
#   3b: all N releases from one merge render byte-identical pack content, so
#       only the first resolves to `publish` — the rest are `no-change` and,
#       under the old code, skipped the tag push entirely (it lived inside
#       the `action == 'publish'` branch). See "Mirror the release tag"
#       below.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Perform every step including the publish plan and materialization, but stop before committing/pushing."
        type: boolean
        default: true

concurrency:
  group: publish-skills
  cancel-in-progress: false

permissions:
  contents: read

env:
  PACK_REPO: coalesce-labs/catalyst-skills

jobs:
  publish-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A release-triggered run must publish exactly the released ref,
          # not whatever `main` has drifted to since — the pack SHA recorded
          # on CTL-2215 (Phase 4 step 5) and CTC-977's image label must trace
          # back to a real, checked-out release commit.
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Regenerate the agentsSkills target
        run: bun scripts/packaging/cli.mjs render --write --target agentsSkills --allow-losses

      - name: agentskills.io conformance (D4 — refuse to publish an ungraded tree)
        run: bun scripts/packaging/cli.mjs conformance --target agentsSkills

      - name: Require SKILLS_PUBLISH_TOKEN (D5 — fail loudly, never skip)
        env:
          SKILLS_PUBLISH_TOKEN: ${{ secrets.SKILLS_PUBLISH_TOKEN }}
        run: |
          if [[ -z "${SKILLS_PUBLISH_TOKEN}" ]]; then
            echo "::error::SKILLS_PUBLISH_TOKEN is not set. This is the CTL-2215 Phase 4 coordinator gate: create coalesce-labs/catalyst-skills and provision a repository secret named SKILLS_PUBLISH_TOKEN in coalesce-labs/catalyst with push access scoped to that repo, then re-run this workflow. See docs/releases.md."
            exit 1
          fi

      - name: Clone coalesce-labs/catalyst-skills
        env:
          SKILLS_PUBLISH_TOKEN: ${{ secrets.SKILLS_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          if ! git clone --depth 1 "https://x-access-token:${SKILLS_PUBLISH_TOKEN}@github.com/${PACK_REPO}.git" /tmp/catalyst-skills; then
            echo "::error::Could not clone ${PACK_REPO} — either it does not exist yet (CTL-2215 Phase 4) or the token lacks access to it."
            exit 1
          fi
          git -C /tmp/catalyst-skills config user.name "catalyst-release-bot"
          git -C /tmp/catalyst-skills config user.email "release-bot@users.noreply.github.com"

      - name: Compute the publish plan and materialize it (git-free — see the script header)
        id: publish
        run: bun scripts/packaging/publish/run-publish.mjs --pack-dir /tmp/catalyst-skills

      - name: Commit
        if: steps.publish.outputs.action == 'publish'
        working-directory: /tmp/catalyst-skills
        env:
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_REF: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git add -A -- skills
          git commit -m "sync: portable skills pack from ${SOURCE_REPO}@${SOURCE_REF} (${SOURCE_SHA})" \
            -m "Generated by scripts/packaging/cli.mjs render --target agentsSkills — never hand-edit this repo. See ${SOURCE_REPO}'s docs/releases.md."

      - name: Push branch (workflow_dispatch real run only — dry_run stops here)
        if: steps.publish.outputs.action == 'publish' && github.event_name == 'workflow_dispatch' && !inputs.dry_run
        working-directory: /tmp/catalyst-skills
        run: |
          set -euo pipefail
          # No release tag to mirror on a workflow_dispatch run — there is
          # no github.event.release to draw a tag name from.
          git push origin HEAD:main

      - name: Mirror the release tag (CTL-2263 3b — atomic on publish, tag-alone on no-change; idempotent + fail-closed)
        if: github.event_name == 'release'
        working-directory: /tmp/catalyst-skills
        env:
          SOURCE_REF: ${{ github.event.release.tag_name }}
          PUBLISH_ACTION: ${{ steps.publish.outputs.action }}
        run: |
          set -euo pipefail
          # Reachable on 'publish' AND 'no-change' — both are legitimate
          # outcomes of a release trigger and AC2 requires every release be
          # traceable to a pack SHA, not just the one release (of up to 5
          # from one merge) that happened to carry new content. Never
          # reachable on 'inconclusive': run-publish.mjs exits 1 for it, so
          # the job already failed before this step's `if:` is evaluated.
          #
          # Idempotent + fail-closed: a tag already pointing at this run's
          # SHA is a re-run (succeed, no-op); a tag pointing at a DIFFERENT
          # SHA means two different pack contents claim one release tag —
          # fail loudly rather than silently overwrite the only record of
          # which one a consumer pinned.
          EXISTING_SHA="$(git ls-remote --tags origin "refs/tags/${SOURCE_REF}" | awk '{print $1}')"
          if [[ -n "${EXISTING_SHA}" ]]; then
            LOCAL_SHA="$(git rev-parse HEAD)"
            if [[ "${EXISTING_SHA}" == "${LOCAL_SHA}" ]]; then
              echo "::notice::tag ${SOURCE_REF} already points at ${LOCAL_SHA} (re-run) — nothing to do."
              exit 0
            fi
            echo "::error::tag ${SOURCE_REF} already exists pointing at ${EXISTING_SHA}, but this run's pack HEAD is ${LOCAL_SHA}. Refusing to overwrite — two different pack contents cannot share one release tag."
            exit 1
          fi
          git tag "${SOURCE_REF}"
          if [[ "${PUBLISH_ACTION}" == "publish" ]]; then
            # This run committed new content locally (see the Commit step
            # above) — push branch + tag as ONE atomic transaction so a
            # failed tag update can never leave an untagged pack commit. A
            # two-step push (branch, then tag) can split: a tag push failing
            # after the branch push already succeeded leaves the pack commit
            # permanently untagged, and a later re-run sees the tree already
            # matches, reports no-change, and has no branch update left to
            # retry the tag alongside.
            git push --atomic origin HEAD:main "refs/tags/${SOURCE_REF}"
          else
            # no-change: nothing to push on the branch, so the tag mirrors
            # the SHA already on origin/main. Pushing it alone is safe
            # precisely because there is no branch update to tear.
            git push origin "refs/tags/${SOURCE_REF}"
          fi

      - name: Dry run — report the plan without pushing
        if: steps.publish.outputs.action == 'publish' && github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: |
          echo "::notice::dry_run=true — plan computed and materialized locally in the runner; nothing committed or pushed. Re-run with dry_run=false to publish for real."

      - name: Emit the resulting pack SHA
        if: github.event_name == 'release' || (steps.publish.outputs.action == 'publish' && github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        working-directory: /tmp/catalyst-skills
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=${sha}" >>"$GITHUB_OUTPUT"
          echo "### Published pack SHA: \`${sha}\`" >>"$GITHUB_STEP_SUMMARY"
          echo "This is the pinning unit CTC-977's runner image label records."  >>"$GITHUB_STEP_SUMMARY"
