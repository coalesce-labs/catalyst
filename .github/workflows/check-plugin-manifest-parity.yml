name: Check Plugin Manifest Parity

# Real-tree successor to the deleted validate-release-config.sh Checks 9-11
# (CTL-2220 removed release-please and the release-please-specific script
# those checks lived in). Asserts, on every PR, that the Claude and Codex
# plugin.json version fields agree and that neither marketplace catalog
# carries a stray version field — see docs/releases.md.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-plugin-manifest-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Claude/Codex plugin.json parity
        run: bash scripts/check-plugin-manifest-parity.sh

      # CTL-2263: the subject script above runs on every PR, but nothing ran
      # its OWN test until now — so a regression that made Check 4 pass
      # vacuously (the exact failure mode that check exists to prevent) would
      # have gone unnoticed, because a check that cannot fail still exits 0.
      # Same shape as packaging-gate.yml running drift-gate.test.sh alongside
      # the drift gate itself.
      - name: Test the parity script's own failure behaviour (fixtures, not this checkout)
        run: bash scripts/__tests__/check-plugin-manifest-parity.test.sh
