name: Orch Monitor Quality Gates

on:
  pull_request:
    branches: [main]
    paths:
      - "plugins/dev/scripts/orch-monitor/**"
      # CTL-1628: the root bun workspace lockfile/manifest — a change here affects
      # orch-monitor's (and orch-monitor/ui's) install.
      - "package.json"
      - "bun.lock"
      - "turbo.json"

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/dev/scripts/orch-monitor
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        # CTL-1628: a single root bun workspace/lockfile now covers both
        # orch-monitor and orch-monitor/ui as workspace members — install once
        # at the repo root instead of two separate per-package installs.
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Dead code check
        run: bun run knip:ci

      - name: Test
        run: bun test
