      - name: Ensure zsh is available (phase-artifact-gate zsh regression coverage)
        # phase-artifact-gate.test.sh's Test 11 sources lib/phase-artifact-gate.sh
        # under zsh to lock down the shopt/nullglob bug this lib was written to
        # avoid (Codex P2 follow-up) — it SKIPS (not fails) when zsh is absent, so
        # without this step the required check could pass without ever exercising
        # the zsh path. Installed explicitly rather than assumed present on the
        # runner image so the regression coverage doesn't silently degrade to a skip.
        # CTL-2079: install zsh only when absent, but non-interactive + dpkg-lock-bounded
