# execution-core-tests.yml
#
# Runs the stable execution-core unit-test suite on every PR and push to main
# that touches the execution-core source tree. The workflow itself now always
# triggers on `pull_request` (see the PR-TRIGGER NOTE below); `detect-changes` +
# `execution-core-unit-tests`'s job-level `if:` is what keeps the actual suite
# scoped to relevant changes — a PR that doesn't touch execution-core gets a fast
# `skipped` conclusion instead of paying for the full ~30-step job.
#
# REQUIRED-STATUS-CHECK OPERATOR NOTE (CTL-963)
# -----------------------------------------------
# After this workflow is merged, a repository admin must mark the job
#   execution-core-unit-tests
# as a REQUIRED status check on the main branch ruleset so that the auto-merge
# floor is enforced.
#
# Steps (GitHub UI path):
#   Settings → Branches → Branch protection rules → main
#   → "Require status checks to pass before merging"
#   → Search for and add: "execution-core-unit-tests"
#
# Or via gh CLI:
#   gh api repos/{owner}/{repo}/branches/main/protection \
#     --method PATCH \
#     --field required_status_checks='{"strict":true,"contexts":["execution-core-unit-tests"]}'
#
# The exact check name is: execution-core-unit-tests
# (matches the job id below — GitHub derives the check name from the job id)

name: Execution Core Unit Tests

# PR-TRIGGER NOTE (thagale/catalyst PR #30 follow-up)
# -----------------------------------------------------
# `pull_request` deliberately carries NO `paths:` filter, unlike `push` below. A
# required status check that is also path-filtered AT THE TRIGGER LEVEL can never
# resolve on a PR whose diff doesn't match the filter — GitHub has nothing to post
# a conclusion for, so branch protection waits on "Expected" forever and the PR is
# permanently BLOCKED regardless of what it touches (observed on a PR that only
# changed `.catalyst/config.json`). The workflow now always triggers on `pull_request`
# so the check always posts a real conclusion; the path-scoping moved into the
# `detect-changes` job below plus `execution-core-unit-tests`'s job-level `if:`. A
# job skipped via `if:` still reports a conclusion (`skipped`), which GitHub DOES
# accept as satisfying a required status check — unlike a workflow that never ran.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "plugins/dev/scripts/execution-core/**"
      # CTL-1348: the updater safety tests (updater/plugin-pull-defer.test.mjs) import and
      # gate the broker cutover invariant in broker/plugin-refresh.mjs, so a PR touching
      # only the broker must run this suite too (Codex P2).
      - "plugins/dev/scripts/broker/**"
      # CTL-1529 round 3: event-log-read-guard.test.mjs scans the WHOLE
      # plugins/dev/scripts tree for whole-file event-log reads (round 2 scanned an
      # enumerated 4 of 16 directories and the header overstated it). The trigger
      # must match the scan, or a new whole-log read lands in an untriggered
      # directory and the guard never runs — which is how otel-forward/lib/dlq.ts's
      # three unbounded reads sat unnoticed in a long-lived daemon.
      - "plugins/dev/scripts/**"
      # NOTE: the glob above SUBSUMES every plugins/dev/scripts path listed below.
      # They are retained as documentation of WHICH STEP each path feeds, not as
      # triggers — do not read the list as the trigger set.
      # CTL-1369: the catalyst-install launcher, the `catalyst` router, and the CLI
      # registration (install-cli.sh / check-setup.sh) are the production entry path to
      # `catalyst install|uninstall|reinstall`; changing them must run the smoke test below.
      - "plugins/dev/scripts/catalyst-install"
      - "plugins/dev/scripts/catalyst"
      - "plugins/dev/scripts/catalyst-linear"
      - "plugins/dev/scripts/catalyst-stack"
      # CTL-1531: orphan-sweep-plist.test.sh VALIDATES this template, so a PR that
      # edits only the plist must run this workflow or the test never sees it.
      - "plugins/dev/scripts/orch-monitor/dist/ai.coalesce.catalyst-orphan-sweep.plist"
      - "plugins/dev/scripts/install-cli.sh"
      - "plugins/dev/scripts/check-setup.sh"
      # CTL-1531: orphan-sweep.sh is a DESTRUCTIVE, kill-processes script whose
      # only guard is __tests__/orphan-sweep.test.sh (run below). Before CTL-1531
      # it appeared in no workflow at all, so a change to its kill gates could
      # merge entirely unverified.
      - "plugins/dev/scripts/orphan-sweep.sh"
      # CTL-1531 round 3: the installer resolves the SWEEP_PROC_WIDEN value baked
      # into the LaunchAgent (shadow vs enforce for the widened process killer),
      # and the template is where that key lives — both are guarded by
      # install-orphan-sweep{,-guard}.test.sh below.
      - "plugins/dev/scripts/install-orphan-sweep.sh"
      - "plugins/dev/scripts/orch-monitor/dist/ai.coalesce.catalyst-orphan-sweep.plist"
      - "plugins/dev/scripts/__tests__/**"
      # CTL-1387: the CLI-reference generator + the page it drives are guarded by
      # cli-reference-drift.test.sh below; a change to either must run this suite.
      - "plugins/dev/scripts/gen-cli-reference.sh"
      - "website/src/content/docs/reference/catalyst-cli.md"
      # CTL-1530: the dual-harness migrator and its checkup §10 wiring — a change to
      # either must run migrate-dual-harness.test.sh below.
      - "plugins/dev/scripts/migrate-dual-harness.sh"
      - "plugins/dev/scripts/check-project-setup.sh"
      - ".github/workflows/execution-core-tests.yml"
      # CTL-1639: worktree-salvage-sites.test.sh scans phase-teardown/SKILL.md for
      # the salvage-before-destroy source-order invariant. That skill lives OUTSIDE
      # plugins/dev/scripts/ (not covered by the scripts/** glob), so a change
      # confined to the teardown removal block would skip this workflow and the
      # ordering backstop couldn't catch a destroy-before-salvage regression.
      - "plugins/dev/skills/phase-teardown/**"
      # CTL-1628: the root bun workspace lockfile/manifest — a change here affects
      # every member package's install (incl. execution-core, broker, otel-forward).
      - "package.json"
      - "bun.lock"
      - "turbo.json"

jobs:
  # Always runs (see the PR-TRIGGER NOTE above) so `execution-core-unit-tests`'s
  # required check always has a conclusion to post. Mirrors the same path set the
  # `push` trigger above enforces at the workflow level, via `dorny/paths-filter`
  # (gitignore-style globs, same semantics as `on.paths`) since `pull_request` no
  # longer filters at the trigger.
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relevant:
              - "plugins/dev/scripts/execution-core/**"
              - "plugins/dev/scripts/broker/**"
              - "plugins/dev/scripts/**"
              - "plugins/dev/scripts/catalyst-install"
              - "plugins/dev/scripts/catalyst"
              - "plugins/dev/scripts/catalyst-linear"
              - "plugins/dev/scripts/catalyst-stack"
              - "plugins/dev/scripts/orch-monitor/dist/ai.coalesce.catalyst-orphan-sweep.plist"
              - "plugins/dev/scripts/install-cli.sh"
              - "plugins/dev/scripts/check-setup.sh"
              - "plugins/dev/scripts/orphan-sweep.sh"
              - "plugins/dev/scripts/install-orphan-sweep.sh"
              - "plugins/dev/scripts/__tests__/**"
              - "plugins/dev/scripts/gen-cli-reference.sh"
              - "website/src/content/docs/reference/catalyst-cli.md"
              - "plugins/dev/scripts/migrate-dual-harness.sh"
              - "plugins/dev/scripts/check-project-setup.sh"
              - ".github/workflows/execution-core-tests.yml"
              - "package.json"
              - "bun.lock"
              - "turbo.json"

  execution-core-unit-tests:
    needs: detect-changes
    # Fail CLOSED: `needs.*.result` is only 'success' when `detect-changes` completed without
    # error. If `dorny/paths-filter` (or the checkout before it) errors — API unavailable, token
    # lacks permission, runner outage — `detect-changes` fails and its `relevant` output is unset,
    # which would make a naive `needs.detect-changes.outputs.relevant == 'true'` check false and
    # SKIP this required job. A skipped required check still posts a `skipped` conclusion, which
    # satisfies branch protection — so a PR touching execution-core could merge without the suite
    # ever running. Running whenever detect-changes did NOT succeed (result != 'success') treats
    # an errored/cancelled detector as "assume relevant" and runs the suite; `!cancelled()` still
    # keeps this job from running if the *workflow run itself* was cancelled.
    if: ${{ !cancelled() && (needs.detect-changes.result != 'success' || needs.detect-changes.outputs.relevant == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/dev/scripts/execution-core

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        # CTL-1628: a single root bun workspace/lockfile now covers execution-core,
        # broker, and otel-forward (among others) — install at the repo root so
        # bun resolves the one root bun.lock instead of a per-package copy.
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Verify import graph (bun build resolution check)
        # CTL-1298: resolve daemon.mjs's full transitive import graph so a missing
        # named export (the CTL-1093 outage: getCatalystRepoDir added to daemon.mjs
        # without an export in config.mjs) fails CI before merge. daemon.mjs is not
        # imported by any included test (daemon.test.mjs is excluded for fs.watch
        # flakiness), so its import graph is otherwise never validated. bun build
        # walks the static graph and exits non-zero on any unresolved import without
        # executing the code; it transitively covers index.mjs -> monitor.mjs too.
        run: bun build daemon.mjs --target=node --outfile /dev/null

      - name: Verify updater import graph (bun build resolution check)
        # CTL-1348: the standalone catalyst-updater agent (updater/updater.mjs) is NOT
        # in daemon.mjs's import graph — it's a separate launchd entrypoint — so a bad
        # cross-tree import (../broker/plugin-refresh.mjs, ../tracing.mjs, getNodeClass)
        # would otherwise only fail at launchd runtime on a node. Walk its static graph.
        run: bun build updater/updater.mjs --target=node --outfile /dev/null

      - name: Verify install-lifecycle import graph (bun build resolution check)
        # CTL-1369 PR3: the catalyst-install lifecycle driver (install-lifecycle.mjs) is a
        # separate CLI entrypoint (the catalyst-install bash launcher execs it), NOT in
        # daemon.mjs's import graph — so a bad cross-module import (./lib/install-telemetry.mjs,
        # ./config.mjs, ../tracing.mjs) would otherwise only fail at install runtime on a node.
        # Walk its static graph.
        run: bun build install-lifecycle.mjs --target=node --outfile /dev/null

      - name: Verify service-manifest import graph (bun build resolution check, CTL-1473)
        # CTL-1473: service-manifest.mjs is the per-class service truth consumed by
        # install-lifecycle.mjs and doctor.mjs. It has no heavy runtime deps (pure
        # constants + helpers), so a bad import silently breaks both consumers. Walk
        # its static graph before merge.
        run: bun build service-manifest.mjs --target=node --outfile /dev/null

      - name: Verify catalyst-linear import graph (node-loadability contract, CTL-1391)
        # CTL-1391: linear-cli.mjs is the catalyst-linear driver, a separate CLI entrypoint
        # NOT in daemon.mjs's graph. Its node-loadability is load-bearing — the write-reject +
        # linearis-fallback paths must load under node (worker/dev hosts without bun), which is
        # why bun:sqlite + @catalyst-cloud/read-model are DYNAMIC imports. A future static
        # bun-only import would silently break that; --target=node walks the static graph and
        # exits non-zero if any bun-only import leaked into it.
        run: bun build linear-cli.mjs --target=node --outfile /dev/null

      - name: Verify cloud-sync import graph (bun build resolution check, CTL-1394)
        # CTL-1394: cloud-sync.mjs is the supervised catalyst-cloud-sync daemon, a separate
        # launchd entrypoint (cloud-sync/launch.sh execs `bun` on it) NOT in daemon.mjs's
        # graph. Walk its static graph so a bad cross-import (./config.mjs,
        # @catalyst-cloud/sdk/node) fails CI before it strands a node at launchd runtime.
        run: bun build cloud-sync.mjs --target=node --outfile /dev/null

      - name: catalyst-install launcher + router smoke test
        # CTL-1369 PR3: exercises the REAL catalyst-install bash launcher (symlink resolution →
        # node → driver) and the `catalyst` router dispatch end-to-end via --dry-run. The mjs unit
        # suite tests the driver directly; this covers the production entry path (launcher / router /
        # CLI registration) that the unit tests bypass.
        working-directory: plugins/dev/scripts
        run: bash __tests__/catalyst-install.test.sh

      - name: daemon-watchdog supervision test (CTL-1502)
        # Covers the bash half of the CTL-1502 Codex P1 fixes: node-class gating
        # (the standalone watchdog runs on a monitor node and NOT on a worker, so
        # a forwarder is never double-supervised), pid-identity checks (a recycled
        # pid is never reported live and never signalled), and lock discipline
        # (stale-owner reaping, a TERM handler that exits rather than resuming,
        # and one lock spanning forward-restart's stop+start).
        working-directory: plugins/dev/scripts
        run: bash __tests__/daemon-watchdog-supervision.test.sh

      - name: forward-restart subcommand test (CTL-1502)
        # Exercises the real catalyst-monitor.sh forward-restart transaction
        # (cold start, hot swap, back-to-back idempotence, usage/dispatch wiring)
        # against a stubbed forwarder — nothing else in CI covers that path.
        working-directory: plugins/dev/scripts
        run: bash execution-core/__tests__/forward-restart.test.sh

      - name: CLI reference doc drift test
        # CTL-1387: asserts website/src/content/docs/reference/catalyst-cli.md
        # documents EXACTLY install-cli.sh's CLI_ENTRIES (and that the page, the
        # gen-cli-reference.sh manifest, and CLI_ENTRIES agree) — so adding a CLI
        # without documenting it fails CI. Pure string assertions; runs no CLIs.
        working-directory: plugins/dev/scripts
        run: bash __tests__/cli-reference-drift.test.sh

      - name: catalyst-stack cloud-sync plist render test
        # CTL-1394: unit-tests the PURE render_cloud_sync_plist (KeepAlive shape,
        # no StartInterval, and the secret-hygiene invariant that the world-readable
        # plist carries no token). Pure string assertions; installs nothing.
        working-directory: plugins/dev/scripts
        run: bash __tests__/catalyst-stack-cloud-sync-plist.test.sh

      - name: Ensure zsh is available (linear-read-replica zsh regression coverage)
        # CAT-35: the suite below sources the helper under `zsh -u` to lock down the
        # nounset regression that broke the production phase-worker read path. Those
        # two assertions SKIP (not fail) when zsh is absent, and this workflow's other
        # zsh install lands hundreds of lines later — so without this step the required
        # check could pass without ever exercising the shell that caused the regression.
        run: command -v zsh >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends zsh)

      - name: linear-read-replica helper test (CTL-1397 + CTL-1403 + CAT-35)
        # CTL-1403: the bash linear_read_ticket helper is the canonical agent read
        # path; this asserts its two-gate freshness + the reads-by-source emit
        # (catalyst.linear.read on every branch: replica HIT / miss / stale / failure).
        working-directory: plugins/dev/scripts
        run: bash __tests__/linear-read-replica.test.sh

      - name: canonical-event builder test (CTL-1403 linear.read.* attrs)
        # Covers build_canonical_line incl. the CTL-1403 --linear-read-* attribute
        # flags (source/result/op top-level attrs + numeric age_ms).
        working-directory: plugins/dev/scripts
        run: bash __tests__/canonical-event.test.sh

      - name: catalyst-stack shipper ephemeral-path guard test (CTL-1473)
        # CTL-1473: guards that install-services (--print and real) refuses to bake
        # an ephemeral config path (worktree or /tmp). Uses CATALYST_FORCE_BAKE_DIR +
        # CATALYST_LAYER2_CONFIG_FILE seams; no launchctl calls.
        working-directory: plugins/dev/scripts
        run: bash __tests__/catalyst-stack-shipper-guard.test.sh

      - name: gh-pr-comment helper test (CTL-1496)
        # Covers PR_NUMBER numeric validation + the idempotent existing-comment
        # guard (skip on match, fail-closed on fetch failure).
        working-directory: plugins/dev/scripts
        run: bash __tests__/gh-pr-comment.test.sh

      - name: recovery-pass pr_not_merged remediation test (CTL-1496)
        working-directory: plugins/dev/scripts
        run: bash __tests__/recovery-pass-pr-not-merged.test.sh

      - name: review-comments headless resolution test (CTL-1496)
        working-directory: plugins/dev/scripts
        run: bash __tests__/review-comments-headless.test.sh

      - name: monitor launcher / dist-redirect test (incl. CTL-1612 webhook-secret projection)
        # Previously ungated in CI (run-tests.sh globs it locally, but the CI job uses an
        # explicit allowlist). Now covers the cmd_start CATALYST_WEBHOOK_SECRET projection
        # that brings the stack launch path to parity with the launchd wrapper.
        working-directory: plugins/dev/scripts
        run: bash __tests__/catalyst-monitor-dist-redirect.test.sh

      - name: liveness-anchor cross-stack parity test (CTL-1612 round 6/7)
        # Pins catalyst-monitor.sh's resolve_liveness_anchor_issue() (a bash mirror of
        # execution-core/config.mjs's getLivenessAnchorIssue(), duplicated deliberately —
        # see the round-6/7 report for the runtime-dependency tradeoff) against the
        # canonical getter via the __tests__/secret-contract-parity.test.sh three-way-
        # assertion pattern, PLUS a jq-less fixture (round 7) exercising the grep/sed
        # fallback rung a jq-absent host takes. Needs jq AND node, both preinstalled on
        # ubuntu-latest runners (mirrors the deployment-mode-parity step above).
        working-directory: plugins/dev/scripts
        run: bash __tests__/liveness-anchor-parity.test.sh

      - name: linear-app-actor scoped-credential unit tests (CTL-1612 rounds 4-6)
        # The only direct regression coverage for lib/linear-app-actor.sh's scoped
        # mode: inherited-alias clearing (round 4), personal lin_api_* key preservation
        # incl. whitespace-trimmed classification (rounds 5/6), and the inherited-token
        # fallback when the monitor's own mint fails or finds no creds (round 6). Lives
        # under lib/__tests__/ rather than __tests__/, so — unlike every other suite in
        # this allowlist — it also needed a dedicated step (round 7): the local
        # run-tests.sh aggregate runner didn't glob that directory either until this
        # same round wired both in together.
        working-directory: plugins/dev/scripts
        run: bash lib/__tests__/linear-app-actor.test.sh

      - name: worktree-salvage primitive + telemetry unit tests (CTL-1639)
        # lib/worktree-salvage.sh snapshots a worktree's unpushed commits +
        # uncommitted changes to ~/catalyst/salvage/ BEFORE any destructive
        # removal. It is the single-source-of-truth primitive four destructive
        # sites (dispatcher L3, orphan-sweep, phase-teardown, JS reaper) call, so
        # a regression here silently re-opens the data-loss hole the ticket
        # closed. Lives under lib/__tests__/ (like linear-app-actor above), so it
        # needs its own explicit step — the CI job's enumerated allowlist does not
        # glob that directory.
        working-directory: plugins/dev/scripts
        run: bash lib/__tests__/worktree-salvage.test.sh

      - name: worktree-salvage destroy-site wiring tests (CTL-1639)
        # Deterministic source-order invariant: each destructive bash site
        # (phase-agent-dispatch L3, orphan-sweep, phase-teardown SKILL.md) must
        # source the salvage lib AND place its salvage_worktree call BEFORE the
        # destructive git op. The dispatcher + teardown suites are not CI-gated
        # (locally flaky), so this static guard is the CI backstop that a future
        # refactor can't move a destroy ahead of its salvage.
        working-directory: plugins/dev/scripts
        run: bash __tests__/worktree-salvage-sites.test.sh

      - name: daemon shared-GitHub-credential projection test (CTL-1612)
        # Covers _project_shared_github_token: the shared SOPS file WINS over a stale
        # inherited GITHUB_TOKEN/GH_TOKEN (the 2026-08-02 fleet outage), an
        # empty/whitespace/absent file is a total no-op that never exports "", and the
        # GITHUB_TOKEN-only case reconciles GH_TOKEN so a stale one cannot outrank it.
        working-directory: plugins/dev/scripts
        run: bash __tests__/catalyst-execution-core-github-token.test.sh

      - name: catalyst-secret-env A/B legacy-vs-folded parity test (CTL-1623)
        # catalyst_project_github_token/_webhook_secret's FILE-READ tier now delegates to
        # lib/catalyst-secret-contract.sh's catalyst_resolve_secret (the CTL-1616 registry
        # engine) instead of hand-rolling its own file search. This suite freezes the
        # pre-fold implementation as a test-local reference and asserts byte-identical
        # results across the full fixture space (explicit overrides, CATALYST_CONFIG_DIR,
        # CATALYST_LAYER2_CONFIG_FILE-derived dir, XDG dedupe, absent/whitespace-only files,
        # trailing-EOL stripping, pipe-in-value, the full github-token precedence ladder),
        # plus two FLAGGED, deliberately-divergent fail-closed cells (NUL-containing file,
        # invalid-UTF-8 file — Codex post-merge round 1) where the folded engine now
        # rejects a candidate the legacy reader would have silently mutated. Sibling suites
        # secret-contract-parity.test.sh / catalyst-secret-contract.test.sh remain CI-dark
        # (pre-existing family-wide gap, tracked separately) — this is the one directly
        # exercising the CTL-1612 pair's own launcher-facing wrapper functions.
        working-directory: plugins/dev/scripts
        run: bash __tests__/catalyst-secret-env-legacy-parity.test.sh

      - name: migrate-dual-harness test (CTL-1530)
        # Covers the dual-harness classification (dual-ok / codex-only /
        # claude-only-monolithic / no-harness), the skills-dir state machine
        # (.claude/skills symlink vs .agents/skills), and the dry-run /
        # --fix / exit-code contract.
        working-directory: plugins/dev/scripts
        run: bash __tests__/migrate-dual-harness.test.sh

      - name: catalyst-runtime-root Bash resolver unit tests (CTL-1628 Phase A2)
        # Pins lib/catalyst-runtime-root.sh's catalyst_dev_scripts (probe order,
        # sentinel, sort -V newest-wins, LOUD miss), catalyst_plugin_root (Q3
        # ancestor walk), and catalyst_runtime_layout classification. Was
        # previously unwired (no allowlist entry) so this contract had no CI guard.
        working-directory: plugins/dev/scripts
        run: bash __tests__/catalyst-runtime-root.test.sh

      - name: catalyst-runtime-root mjs resolver unit tests (bun, CTL-1628 Phase A2)
        # The .mjs twin of the suite above. Own step (not the "Run stable unit
        # tests" allowlist below) because that step's working-directory is
        # execution-core/ and this lib is a deliberately zero-import leaf
        # outside that tree (mirrors the deployment-mode step's own rationale).
        working-directory: plugins/dev/scripts/lib
        run: bun test catalyst-runtime-root.test.mjs

      - name: deployment-mode resolver unit tests (bun, CTL-1617)
        # Codex remediation: neither of the three deployment-mode suites was
        # named anywhere in this workflow (nor any other), so required CI
        # stayed green without ever exercising lib/deployment-mode.mjs, its
        # Bash mirror, or their cross-stack agreement. This is the JS-side
        # unit suite (resolveDeploymentMode/getDeploymentMode's validity
        # ladder, the injected-env isolation contract). Its own step because
        # lib/deployment-mode.mjs is a deliberately ZERO-IMPORT leaf outside
        # the execution-core/ tree the "Run stable unit tests" step below is
        # scoped to.
        working-directory: plugins/dev/scripts/lib
        run: bun test deployment-mode.test.mjs

      - name: deployment-mode Bash resolver unit test (CTL-1617)
        # The Bash mirror's own standalone suite (lib/catalyst-deployment-mode.sh) —
        # see the bun step above for why this suite was previously ungated.
        working-directory: plugins/dev/scripts
        run: bash __tests__/catalyst-deployment-mode.test.sh

      - name: deployment-mode cross-stack parity test (CTL-1617)
        # The fixture-matrix parity test asserting bash == node == the
        # design-spec-computed expected value at every cell (168 fixture
        # cells x 2 assertions, plus the dedicated divergence-pinning probes
        # for the NUL-byte, NBSP-padding, malformed-trailing-content, and
        # lone-surrogate hostile inputs). Needs jq, preinstalled on
        # ubuntu-latest runners.
        working-directory: plugins/dev/scripts
        run: bash __tests__/deployment-mode-parity.test.sh

      - name: Broker worker-state projection test (CTL-1529)
        # CTL-1529 round 2: broker/worker-state-projection.test.mjs guards the
        # bounded event-log scan in broker/projection.mjs (replayWorkerStateProjection),
        # and `grep worker-state-projection .github/workflows/` used to return NOTHING —
        # so two of this PR's fixes shipped behind a test CI never ran. It cannot join
        # the `bun test` list below: that job's working-directory is execution-core, and
        # this suite needs the BROKER package's own node_modules (pino) to import
        # ./index.mjs. Hence its own step.
        # CTL-1628: the root workspace install above already covers broker's deps
        # (bun resolves the workspace root's node_modules from this cwd), so no
        # per-package install here anymore.
        working-directory: plugins/dev/scripts/broker
        run: bun test worker-state-projection.test.mjs

      - name: otel-forward tests (CTL-1529 round 3)
        # otel-forward had NO CI coverage at all before this
        # (`grep otel-forward .github/workflows/` returned nothing), and it is a
        # long-lived daemon whose entire job is reading the event log. This round
        # bounded lib/dlq.ts's dlqDepth — a whole-file read + whole-file split on a
        # repeating timer, over a DLQ that grows precisely during an OTLP outage.
        # The whole suite runs: measured 120 pass / 0 fail on this branch and
        # 117 / 0 at the merge base, so there is no pre-existing red to import.
        # (An earlier revision of this step was scoped to dlq.test.ts and justified
        # that with "5 failures, pre-existing" in lib/destinations/* — that was
        # false, and it would have told future readers not to widen.)
        # CTL-1628: the root workspace install above already covers otel-forward's
        # deps, so no per-package install here anymore.
        working-directory: plugins/dev/scripts/otel-forward
        run: bun test

      - name: orphan-sweep kill-gate test (CTL-1531)
        # orphan-sweep.sh KILLS PROCESSES and removes worktrees, and had ZERO CI
        # coverage before CTL-1531. The suite is fully hermetic — ps, lsof, pgrep
        # and kill are all mocked into a scratch $PATH, $HOME is redirected to a
        # temp dir, and no real process is ever enumerated or signalled.
        working-directory: plugins/dev/scripts
        run: bash __tests__/orphan-sweep.test.sh

      - name: orphan-sweep LaunchAgent plist test (CTL-1531)
        working-directory: plugins/dev/scripts
        run: bash __tests__/orphan-sweep-plist.test.sh

      - name: orphan-sweep installer test (CTL-1531)
        # The installer resolves the SWEEP_PROC_WIDEN rollout value that ends up
        # in the LaunchAgent's EnvironmentVariables — i.e. whether the widened
        # process killer runs in shadow or enforce on every host. Its 7 I13
        # assertions guard the precedence chain (env → .catalyst/config.json →
        # the value already installed → shadow) and, crucially, that a routine
        # `catalyst-stack install-services` does NOT silently revert an operator's
        # flip. Hermetic: launchctl/uname mocked, $HOME redirected to a temp dir,
        # and the baked program path is a purpose-built scratch dir handed in via
        # CATALYST_FORCE_BAKE_DIR — nothing is ever loaded into real launchd.
        working-directory: plugins/dev/scripts
        # NOTE: the runner is ubuntu and the installer is a macOS LaunchAgent, so
        # this suite SKIPS here (loudly, rc=0) and its 38 assertions only execute
        # on a developer Mac. Wiring it in still catches a syntax/gate break; it
        # is NOT full CI coverage. A macos-latest job would close that.
        run: bash __tests__/install-orphan-sweep.test.sh

      - name: orphan-sweep installer ephemeral-path guard test (CTL-1306)
        # The CTL-1306 guard the suite above deliberately routes around: baking a
        # linked-worktree / temp program path into the LaunchAgent silently
        # exit-127'd the reaper fleet-wide. Runs the REAL refusal paths.
        working-directory: plugins/dev/scripts
        run: bash __tests__/install-orphan-sweep-guard.test.sh

      - name: Ensure zsh is available (phase-artifact-gate zsh regression coverage)
        # phase-artifact-gate.test.sh's Test 11 sources lib/phase-artifact-gate.sh
        # under zsh to lock down the shopt/nullglob bug this lib was written to
        # avoid (Codex P2 follow-up) — it SKIPS (not fails) when zsh is absent, so
        # without this step the required check could pass without ever exercising
        # the zsh path. Installed explicitly rather than assumed present on the
        # runner image so the regression coverage doesn't silently degrade to a skip.
        run: command -v zsh >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends zsh)

      - name: phase-artifact-gate contract + zsh regression test
        # Covers match_thoughts_artifact (tail/slug/case forms, cross-ticket
        # lookalike + hidden-file + subdirectory exclusion, deterministic sort
        # order) and the zsh-sourcing regression (Test 11) — previously unwired
        # in this required check (Codex P2 follow-up): the shell-test allowlist
        # above invoked neither this suite nor run-tests.sh, so the zsh behavior
        # it locks down was unverified in CI.
        working-directory: plugins/dev/scripts
        run: bash __tests__/phase-artifact-gate.test.sh

      - name: Run stable unit tests
        # CTL-1678 round-7 (Codex): the four drain suites added below
